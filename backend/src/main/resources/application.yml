server:
  port: ${PORT:8080}

spring:
  application:
    name: smakbot-core
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smakbot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

smakbot:
  cors:
    # Orígenes permitidos para el panel administrativo (el widget /api/v1/chat/** acepta cualquier origen)
    admin-origins: ${ADMIN_ORIGINS:http://localhost:4200}
  meta:
    graph-base-url: ${META_GRAPH_URL:https://graph.facebook.com/v20.0}
    # Habilitar despacho saliente real hacia Meta Graph API
    outbound-enabled: ${META_OUTBOUND_ENABLED:true}
    phone-number-id: ${META_PHONE_NUMBER_ID:}
    waba-id: ${META_WABA_ID:}
    access-token: ${META_ACCESS_TOKEN:}
    verify-token: ${META_VERIFY_TOKEN:}
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 1000
  transcription:
    url: ${TRANSCRIPTION_URL:https://automatic-space-dollop-976prv4wg4ghpqqx-8000.app.github.dev/v1/transcribe/sync}
    tts-url: ${TTS_URL:https://automatic-space-dollop-976prv4wg4ghpqqx-8000.app.github.dev/v1/tts/synthesize}
    api-key: ${TRANSCRIPTION_API_KEY:sales-secret-api-key-change-in-prod}
  redis:
    enabled: ${REDIS_ENABLED:true}
    session-ttl-minutes: ${REDIS_SESSION_TTL:45}
    checkout-ttl-hours: ${REDIS_CHECKOUT_TTL:24}
    idempotency-ttl-minutes: ${REDIS_IDEMPOTENCY_TTL:5}
    catalog-ttl-minutes: ${REDIS_CATALOG_TTL:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
