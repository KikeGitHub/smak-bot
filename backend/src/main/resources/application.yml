server:
  port: ${PORT:8080}

spring:
  application:
    name: smakbot-core
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smakbot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

smakbot:
  cors:
    # Orígenes permitidos para el panel administrativo (el widget /api/v1/chat/** acepta cualquier origen)
    admin-origins: ${ADMIN_ORIGINS:http://localhost:4200}
  meta:
    graph-base-url: ${META_GRAPH_URL:https://graph.facebook.com/v20.0}
    # Si es false, no se llama a Meta: los mensajes salientes solo se registran en log (modo sandbox)
    outbound-enabled: ${META_OUTBOUND_ENABLED:false}
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 1000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
